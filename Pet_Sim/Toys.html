<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet - Toys</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="toys-title">Pet Toys</h1>
    <div class="toys-balance">Balance: $<span id="toysMoneyDisplay">0</span></div>

    <!-- Top Buttons -->
    <div class="top-buttons">
        <a href="Q and A.html" class="qa-btn">Q & A</a>
        <a href="Home.html" class="qa-btn">Home</a>
    </div>

    <div class="toys-container">
        <!-- First row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item" data-toy-id="1">
                <div class="toy-rectangle">
                    <img src="images/carrots.png" alt="Carrots" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="1" data-price="15">Buy - $15</button>
            </div>

            <div class="toy-item" data-toy-id="2">
                <div class="toy-rectangle">
                    <img src="images/pet-ball.png" alt="Ball" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="2" data-price="20">Buy - $20</button>
            </div>

            <div class="toy-item" data-toy-id="3">
                <div class="toy-rectangle">
                    <img src="images/circle-toy.png" alt="Circle Toy" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="3" data-price="25">Buy - $25</button>
            </div>
        </div>

        <!-- Second row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item" data-toy-id="4">
                <div class="toy-rectangle">
                    <img src="images/yarn.png" alt="Yarn" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="4" data-price="30">Buy - $30</button>
            </div>

            <div class="toy-item" data-toy-id="5">
                <div class="toy-rectangle">
                    <img src="images/dog-bone.png" alt="Bone" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="5" data-price="40">Buy - $40</button>
            </div>

            <div class="toy-item" data-toy-id="6">
                <div class="toy-rectangle">
                    <img src="images/dog-toy.png" alt="Premium Toy" class="toy-image">
                </div>
                <button class="buy-btn" data-toy="6" data-price="55">Buy - $55</button>
            </div>
        </div>
    </div>

    <!-- Home button at bottom -->
    <a href="Home.html" class="home-btn">Home</a>

    <script src="script.js"></script>
    <script>
        // Toy image mappings
        const toyImages = {
            1: 'images/carrots.png',
            2: 'images/pet-ball.png',
            3: 'images/circle-toy.png',
            4: 'images/yarn.png',
            5: 'images/dog-bone.png',
            6: 'images/dog-toy.png'
        };

        // Function to handle toy purchase
        function buyToy(toyId, price) {
            const state = getGameState();
            
            // Initialize toys array if it doesn't exist
            if (!state.ownedToys) {
                state.ownedToys = [];
            }
            
            // Check if already owned
            if (state.ownedToys.includes(toyId)) {
                // If already owned, select it as active
                state.activeToy = toyId;
                saveGameState(state);
                alert('Toy equipped!');
                updateToysDisplay();
                return;
            }
            
            // Check if can afford
            if (state.money >= price) {
                // Deduct money
                state.money -= price;
                // Add to owned toys
                state.ownedToys.push(toyId);
                // Set as active toy
                state.activeToy = toyId;
                saveGameState(state);
                
                alert(`Toy purchased and equipped for $${price}!`);
                updateToysDisplay();
            } else {
                alert(`Not enough money! You need $${price} but only have $${state.money}.`);
            }
        }

        // Update display based on owned toys and money
        function updateToysDisplay() {
            const state = getGameState();
            const ownedToys = state.ownedToys || [];
            const activeToy = state.activeToy || null;
            
            // Update money display
            const moneyDisplay = document.getElementById('toysMoneyDisplay');
            if (moneyDisplay) {
                moneyDisplay.textContent = state.money;
            }
            
            // Update each toy item
            document.querySelectorAll('.toy-item').forEach(item => {
                const toyId = parseInt(item.dataset.toyId);
                const button = item.querySelector('.buy-btn');
                const price = parseInt(button.dataset.price);
                const rectangle = item.querySelector('.toy-rectangle');
                const image = item.querySelector('.toy-image');
                
                // Check if owned
                const isOwned = ownedToys.includes(toyId);
                const isActive = activeToy === toyId;
                const canAfford = state.money >= price;
                
                if (isOwned) {
                    // Owned - change button to "Equip" or "Equipped"
                    if (isActive) {
                        button.textContent = 'Equipped';
                        button.disabled = true;
                        button.classList.add('equipped');
                        button.classList.remove('insufficient-funds');
                        rectangle.style.border = '4px solid #FFD700';
                        image.style.filter = 'grayscale(0%)';
                        image.style.opacity = '1';
                    } else {
                        button.textContent = 'Equip';
                        button.disabled = false;
                        button.classList.remove('equipped', 'insufficient-funds');
                        rectangle.style.border = '2px solid #ccc';
                        image.style.filter = 'grayscale(0%)';
                        image.style.opacity = '1';
                    }
                } else {
                    // Not owned - show buy button
                    button.textContent = `Buy - $${price}`;
                    rectangle.style.border = '2px solid #ccc';
                    
                    if (!canAfford) {
                        button.disabled = true;
                        button.classList.add('insufficient-funds');
                        button.classList.remove('equipped');
                        image.style.filter = 'grayscale(100%)';
                        image.style.opacity = '0.5';
                    } else {
                        button.disabled = false;
                        button.classList.remove('insufficient-funds', 'equipped');
                        image.style.filter = 'grayscale(0%)';
                        image.style.opacity = '1';
                    }
                }
            });
        }

        // Add click handlers to all buy buttons
        document.querySelectorAll('.buy-btn').forEach(button => {
            button.addEventListener('click', function() {
                const toyId = parseInt(this.dataset.toy);
                const price = parseInt(this.dataset.price);
                buyToy(toyId, price);
            });
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            updateToysDisplay();
        });
    </script>
</body>
</html>
