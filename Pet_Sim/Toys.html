<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet - Toys</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .toys-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 40px;
        }

        .toys-title {
            color: hsl(196, 80%, 35%);
            font-size: 72px;
            margin: 0;
            text-align: center;
            font-family: 'Maiandra GD', sans-serif;
        }

        .toys-row {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .toy-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .toy-rectangle {
            width: 250px;
            height: 250px;
            background-color: white;
            border: 3px solid hsl(196, 99%, 50%);
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .toy-rectangle:hover {
            border-color: #001a4d;
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .toy-rectangle img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .toy-placeholder {
            font-size: 18px;
            color: #999;
            text-align: center;
            padding: 20px;
        }

        .buy-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            background-color: hsl(196, 99%, 50%);
            color: white;
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .buy-btn:hover {
            border-color: #001a4d;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .buy-btn:active {
            transform: translateY(0);
        }

        .buy-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <h1 class="toys-title">Pet Toys</h1>

    <div class="toys-container">
        <!-- First row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 1<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(1, 20)">Buy - $20</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 2<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(2, 25)">Buy - $25</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 3<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(3, 30)">Buy - $30</button>
            </div>
        </div>

        <!-- Second row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 4<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(4, 35)">Buy - $35</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 5<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(5, 40)">Buy - $40</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 6<br>Coming Soon</div>
                </div>
                <button class="buy-btn" onclick="buyToy(6, 45)">Buy - $45</button>
            </div>
        </div>
    </div>

    <!-- Home button at bottom -->
    <a href="Home.html" class="home-btn">Home</a>

    <script src="script.js"></script>
    <script>
        // Function to handle toy purchase
        function buyToy(toyNumber, price) {
            const state = getGameState();
            
            if (state.money >= price) {
                // Deduct money
                state.money -= price;
                saveGameState(state);
                
                // Show success message
                alert(`Successfully purchased Toy ${toyNumber} for $${price}!`);
                
                // Update display if needed (for future implementation)
            } else {
                // Not enough money
                alert(`Not enough money! You need $${price} but only have $${state.money}.`);
            }
        }

        // Update button states based on available money
        function updateBuyButtons() {
            const state = getGameState();
            const buttons = document.querySelectorAll('.buy-btn');
            
            buttons.forEach(button => {
                const onclick = button.getAttribute('onclick');
                const priceMatch = onclick.match(/buyToy\(\d+,\s*(\d+)\)/);
                if (priceMatch) {
                    const price = parseInt(priceMatch[1]);
                    if (state.money < price) {
                        button.disabled = true;
                        button.style.opacity = '0.6';
                    } else {
                        button.disabled = false;
                        button.style.opacity = '1';
                    }
                }
            });
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            updateBuyButtons();
        });
    </script>
</body>
</html>
