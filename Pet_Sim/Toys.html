<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet - Toys</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="toys-title">Pet Toys</h1>

    <div class="toys-container">
        <!-- First row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 1<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="1" data-price="20" onclick="buyToy(1, 20)">Buy - $20</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 2<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="2" data-price="25" onclick="buyToy(2, 25)">Buy - $25</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 3<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="3" data-price="30" onclick="buyToy(3, 30)">Buy - $30</button>
            </div>
        </div>

        <!-- Second row of 3 toys -->
        <div class="toys-row">
            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 4<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="4" data-price="35" onclick="buyToy(4, 35)">Buy - $35</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 5<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="5" data-price="40" onclick="buyToy(5, 40)">Buy - $40</button>
            </div>

            <div class="toy-item">
                <div class="toy-rectangle">
                    <div class="toy-placeholder">Toy 6<br>Coming Soon</div>
                </div>
                <button class="buy-btn" data-toy="6" data-price="45" onclick="buyToy(6, 45)">Buy - $45</button>
            </div>
        </div>
    </div>

    <!-- Home button at bottom -->
    <a href="Home.html" class="home-btn">Home</a>

    <script src="script.js"></script>
    <script>
        // Function to handle toy purchase
        function buyToy(toyNumber, price) {
            const state = getGameState();
            
            if (state.money >= price) {
                // Deduct money
                state.money -= price;
                saveGameState(state);
                
                // Show success message
                alert(`Successfully purchased Toy ${toyNumber} for $${price}!`);
                
                // Update display if needed (for future implementation)
            } else {
                // Not enough money
                alert(`Not enough money! You need $${price} but only have $${state.money}.`);
            }
        }

        // Update button states based on available money
        function updateBuyButtons() {
            const state = getGameState();
            const buttons = document.querySelectorAll('.buy-btn');
            
            buttons.forEach(button => {
                const price = parseInt(button.dataset.price);
                if (state.money < price) {
                    button.disabled = true;
                    button.classList.add('insufficient-funds');
                } else {
                    button.disabled = false;
                    button.classList.remove('insufficient-funds');
                }
            });
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            updateBuyButtons();
        });
    </script>
</body>
</html>
