<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Virtual Pet</h1>
    
    <!-- Total box -->
    <div class="total-box">
        <div id="moneyDisplay">Total Balance: $100</div>
        <button class="restart-btn" onclick="restartGame()" title="Start over with a new pet">Restart</button>
    </div>

    <!-- Top Buttons -->
    <div class="top-buttons">
        <a href="Q and A.html" class="qa-btn">Q & A</a>
        <a href="Toys.html" class="qa-btn">Toy Purchase</a>
    </div>
    
    <div class="home-container">
        <!-- Left side buttons -->
        <div class="side-buttons">
            <div class="button-with-progress">
                <a href="Play.html" class="action-btn">Play <span id="playProgressText">5/10</span> </a>
                <div class="button-progress-bar">
                           <div class="button-progress-fill" id="playProgressFill"></div>
                </div>
            </div>
            <div class="button-with-progress">
                <a href="Rest.html" class="action-btn">Rest <span id="restProgressText">5/10</span> </a>
                <div class="button-progress-bar">
                    <div class="button-progress-fill" id="restProgressFill"></div>
                </div>
            </div>
             <div class="button-with-progress">
                <a href="Vet.html" class="action-btn">Health <span id="vetProgressText">5/10</span> (-$50) </a>
                <div class="button-progress-bar">
                    <div class="button-progress-fill" id="vetProgressFill"></div>
                </div>
            </div>
        </div>

        <!-- Center pet name box -->
        <div class="center-box">
            <div class="pet-name-box">
                <h2 id="petNameDisplay">Your Pet</h2>
                <img id="petImage" src="images/normal_dog.png" alt="Your pet">
                <div id="speechBubble" class="speech-bubble" style="display: none;"></div>
            </div>
        </div>  

        <!-- Right side buttons -->
        <div class="side-buttons">
            <div class="button-with-progress">
                <a href="Clean.html" class="action-btn">Clean <span id="cleanProgressText">5/10</span> (-$5)</a>
                <div class="button-progress-bar">
                    <div class="button-progress-fill" id="cleanProgressFill"></div>
                </div>
            </div>
            <div class="button-with-progress">
                <a href="Feed.html" class="action-btn">Feed <span id="feedProgressText">5/10</span> (-$10)</a>
                <div class="button-progress-bar">
                    <div class="button-progress-fill" id="feedProgressFill"></div>
                </div>
            </div>
            <div class="button-with-progress">
                <a href="Competition.html" class="action-btn" style="display: flex; align-items: center; justify-content: center; border-radius: 20px;">Competition (+$100)</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
